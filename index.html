<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>DSA4155 Daily Fit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#080c11">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* Layout: one phone-width column on a deep ink field. Glass cards, a floating tab dock, full-screen session/lab/reader sheets.
   Signature: the viridis ramp (violet → teal → green → yellow) as gradient ink for progress, rings and accents. Single dark look by design. */
:root{
  --bg:#080c11; --bg-2:#0c121a;
  --surface:#111922; --surface-2:#16212c; --surface-3:#1d2a37;
  --line:rgba(160,190,215,.10); --line-2:rgba(160,190,215,.18);
  --ink:#e9eff4; --muted:#8c9cab; --faint:#5f6f7e;
  --accent:#45d0b0; --accent-ink:#03211b; --accent-soft:rgba(69,208,176,.12);
  --violet:#8e72ff; --violet-soft:rgba(142,114,255,.14);
  --spark:#f4dc3a; --spark-ink:#221c00;
  --good:#5fd58e; --good-soft:rgba(95,213,142,.11);
  --bad:#ff7d6e; --bad-soft:rgba(255,125,110,.10);
  --frost:#7cc4ff;
  --h0:#141e28; --h1:#365c8d; --h2:#1fa187; --h3:#4ac16d; --h4:#fde725;
  --grad:linear-gradient(115deg,#7b5cff 0%,#3a8fd0 38%,#3fcfa4 70%,#d8e83a 100%);
  --grad-soft:linear-gradient(115deg,rgba(123,92,255,.22),rgba(58,143,208,.14) 45%,rgba(63,207,164,.12) 75%,rgba(216,232,58,.10));
  --shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 12px 32px -18px rgba(0,0,0,.8);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-quote:"Instrument Serif","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --r:18px; --tabh:64px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  background:radial-gradient(90% 55% at 0% 0%,rgba(123,92,255,.20),transparent 60%),radial-gradient(70% 45% at 100% 8%,rgba(63,207,164,.10),transparent 60%),var(--bg);background-repeat:no-repeat;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
::selection{background:rgba(69,208,176,.35)}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--accent)}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible,summary:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.gtext{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(8,12,17,.72);-webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:8px;padding-block:10px}
.brand{font-family:var(--f-display);font-weight:800;font-size:18px;letter-spacing:-.02em;line-height:1.1;flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.brand .mark{width:30px;height:30px;flex:none;border-radius:9px;background:var(--grad);display:grid;place-items:center;box-shadow:0 6px 18px -6px rgba(123,92,255,.6)}
.brand .mark svg{width:18px;height:18px;stroke:#0a0f14;stroke-width:2.6;fill:none;stroke-linecap:round}
.brand .bt{min-width:0}
.brand small{display:block;font-family:var(--f-mono);font-weight:500;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small .ok{color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line-2);font-family:var(--f-mono);font-weight:600;font-size:13px;white-space:nowrap}
.chip svg{width:16px;height:16px}
.flame{fill:url(#flameGrad)}
.flame.cold{fill:var(--faint)}
.ice{stroke:var(--frost);fill:none;stroke-width:2;stroke-linecap:round}

main{padding-block:18px calc(var(--tabh) + 44px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:14px}
.view > *{animation:rise .45s cubic-bezier(.2,.7,.2,1) both}
.view > *:nth-child(2){animation-delay:.03s}.view > *:nth-child(3){animation-delay:.06s}.view > *:nth-child(4){animation-delay:.09s}.view > *:nth-child(5){animation-delay:.12s}.view > *:nth-child(n+6){animation-delay:.15s}
@keyframes rise{from{opacity:.001;transform:translateY(8px)}to{opacity:1;transform:none}}
h2.sec{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:14px 0 -2px}
h2.sec::before{content:"";width:14px;height:2px;border-radius:2px;background:var(--grad)}
.panel{background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,0)) ,var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.small{font-size:12.5px;color:var(--muted)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:14px;padding:13px 18px;font-weight:600;font-size:15.5px;min-height:50px;transition:transform .12s ease, filter .15s, background .15s, border-color .15s;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--grad);color:#07110f;box-shadow:0 10px 28px -12px rgba(63,207,164,.55)}
.btn-primary:hover{filter:brightness(1.07)}
.btn-accent{background:var(--accent);color:var(--accent-ink)}
.btn-accent:hover{filter:brightness(1.08)}
.btn-ghost{background:rgba(255,255,255,.03);border:1px solid var(--line-2);color:var(--ink)}
.btn-ghost:hover{border-color:rgba(69,208,176,.5);background:var(--accent-soft)}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row .btn{flex:1 1 140px}
.btn[disabled]{opacity:.5;cursor:default}
.btn-sm{min-height:38px;padding:8px 13px;font-size:13.5px;border-radius:11px}
.danger{color:var(--bad)!important}

/* ---------- today ---------- */
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-top:4px}
.hello .date{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hello h1{margin:4px 0 0;font-family:var(--f-display);font-weight:800;font-size:30px;letter-spacing:-.03em;line-height:1.05}
.quote{margin:0;position:relative;padding:20px 18px 16px 20px;border-radius:var(--r);background:var(--grad-soft),var(--surface);border:1px solid var(--line-2);overflow:hidden}
.quote::before{content:"\201C";position:absolute;right:10px;top:-26px;font-family:var(--f-quote);font-size:140px;line-height:1;color:rgba(255,255,255,.06);pointer-events:none}
.quote blockquote{margin:0;font-family:var(--f-quote);font-size:23px;line-height:1.28;letter-spacing:-.005em;text-wrap:pretty;color:#f3f6f8}
.quote figcaption{margin-top:12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.quote cite{font-style:normal;font-size:13px;color:var(--muted)}
.quote cite b{color:var(--ink);font-weight:600}
.quote .why{margin:12px 0 0;padding-top:12px;border-top:1px dashed var(--line-2);font-size:13.5px;color:#c4d0da}
.qbtn{flex:none;width:36px;height:36px;border-radius:11px;border:1px solid var(--line-2);background:rgba(255,255,255,.04);display:grid;place-items:center}
.qbtn svg{width:16px;height:16px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.qbtn:active svg{transform:rotate(-120deg);transition:transform .25s}
.quote.swap blockquote{animation:qfade .35s ease}
@keyframes qfade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.hero{position:relative;overflow:hidden;border-radius:22px;padding:18px;background:radial-gradient(120% 90% at 100% 0%,rgba(123,92,255,.28),transparent 55%),radial-gradient(80% 80% at 0% 100%,rgba(63,207,164,.16),transparent 60%),#0f1620;border:1px solid var(--line-2);box-shadow:0 30px 60px -40px rgba(123,92,255,.6)}
.hero-row{display:flex;gap:16px;align-items:center}
.ring{position:relative;width:118px;height:118px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .trk{stroke:rgba(255,255,255,.07)}
.ring .val{transition:stroke-dashoffset 1s cubic-bezier(.2,.7,.2,1)}
.ring .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .ctr b{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1}
.ring .ctr span{font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.ring .ctr svg.ck{width:34px;height:34px;transform:none;stroke:var(--accent);stroke-width:3;fill:none}
.hero-txt{min-width:0;flex:1}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1.08;letter-spacing:-.02em;margin:0 0 6px;text-wrap:balance}
.hero p{margin:0;color:#b8c4ce;font-size:14px}
.hero .meta{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 14px}
.hero .meta span{font-family:var(--f-mono);font-size:12px;padding:5px 10px;border-radius:9px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.hero .btn-ghost{background:rgba(255,255,255,.05)}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;min-width:0;box-shadow:var(--shadow)}
.tile .k{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tile b{display:flex;align-items:center;gap:5px;font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1.15;margin-top:4px;white-space:nowrap}
.tile b svg{width:20px;height:20px}
.tile .s{font-size:11.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .bar{margin-top:8px}
.r2 sup{font-size:.55em}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.week .d{display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.week .dot{width:32px;height:32px;border-radius:11px;border:1.5px dashed var(--line-2);display:grid;place-items:center;transition:transform .2s}
.week .dot.done{background:var(--grad);border:none;box-shadow:0 6px 16px -8px rgba(63,207,164,.7)}
.week .dot.done svg{width:16px;height:16px;stroke:#07110f;fill:none;stroke-width:3}
.week .dot.frz{border:1.5px solid var(--frost);background:rgba(124,196,255,.08)}
.week .dot.frz svg{width:15px;height:15px}
.week .today .dot{border-style:solid;border-color:var(--accent)}
.week .today{color:var(--ink);font-weight:600}
.streak-note{margin:12px 0 0;font-size:13.5px;color:var(--muted)}

/* level + bars */
.lvl{display:flex;align-items:center;gap:14px}
.lvl .badge-num{width:52px;height:52px;flex:none;border-radius:15px;background:var(--violet-soft);border:1px solid rgba(142,114,255,.35);color:#cbbcff;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:24px}
.lvl .body{flex:1;min-width:0}
.lvl .name{font-family:var(--f-display);font-weight:700;font-size:17px}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.06);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--grad);border-radius:99px;transition:width .6s cubic-bezier(.2,.7,.2,1)}

.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.metric{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;min-width:0;box-shadow:var(--shadow)}
.metric b{display:block;font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1.2;letter-spacing:-.01em}
.metric span{font-size:12.5px;color:var(--muted)}

/* ---------- learn: modules ---------- */
.mod{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start}
.mod .num{grid-row:span 4;font-family:var(--f-display);font-weight:800;font-size:22px;width:36px}
.mod h3{margin:0;font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.25}
.stack{display:flex;height:9px;border-radius:99px;overflow:hidden;background:var(--h0);margin-top:6px;gap:2px}
.stack i{display:block;height:100%;border-radius:99px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.mod .row2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.mod .row2 .btn{padding-inline:8px;white-space:nowrap}
.btn-sm svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}

/* heatmap */
.heat-scroll{overflow-x:auto}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,13px);gap:3px;width:max-content}
.heat i{width:13px;height:13px;border-radius:4px;background:var(--h0)}
.heat i.l1{background:var(--h1)}.heat i.l2{background:var(--h2)}.heat i.l3{background:var(--h3)}.heat i.l4{background:var(--h4)}
.heat i.fut{background:transparent}
.heat i.frz{outline:2px solid var(--frost);outline-offset:-2px}

.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.bdg{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--surface);min-width:0}
.bdg b{display:block;font-family:var(--f-display);font-size:15px}
.bdg span{font-size:12px;color:var(--muted)}
.bdg.off{opacity:.5;border-style:dashed;background:transparent}
.bdg.on{border-color:rgba(69,208,176,.4);background:var(--grad-soft),var(--surface)}

.setting{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.setting:first-of-type{border-top:none;padding-top:0}
.setting label{font-weight:500}
select,input[type=date]{font:inherit;background:var(--surface-2);color:var(--ink);border:1px solid var(--line-2);border-radius:10px;padding:8px 10px}
.confirm{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.toggle{display:flex;align-items:center;gap:10px}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}

/* ---------- tab dock ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
.tabs .wrap{pointer-events:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;height:var(--tabh);max-width:520px;padding:6px;border-radius:22px;background:rgba(17,25,34,.82);-webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%);border:1px solid var(--line-2);box-shadow:0 18px 40px -12px rgba(0,0,0,.8);width:calc(100% - 24px)}
.tabs button{background:none;border:none;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);transition:background .2s,color .2s}
.tabs button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--ink);background:rgba(255,255,255,.07)}
.tabs button[aria-current="page"] svg{stroke:var(--accent)}

/* ---------- session sheet ---------- */
.sheet,.overlay{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:env(safe-area-inset-top,0px);background:radial-gradient(80% 40% at 50% 0%,rgba(123,92,255,.14),transparent 70%),var(--bg)}
.sheet{z-index:50}
#reader{z-index:70} #lab{z-index:60}
.sheet-head,.ov-head{position:sticky;top:0;z-index:2;background:rgba(8,12,17,.78);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.ov-head{border-bottom:1px solid var(--line)}
.sheet-head .wrap,.ov-head .wrap{display:flex;align-items:center;gap:12px;padding-block:12px}
.x{width:40px;height:40px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);display:grid;place-items:center;flex:none}
.x svg{width:18px;height:18px;stroke:var(--ink);stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.prog{flex:1;height:10px;border-radius:99px;background:rgba(255,255,255,.06);overflow:hidden}
.prog i{display:block;height:100%;background:var(--grad);border-radius:99px;transition:width .4s cubic-bezier(.2,.7,.2,1)}
.combo{position:relative;font-family:var(--f-mono);font-weight:600;font-size:13px;color:var(--muted);min-width:44px;text-align:right}
.combo.hot{color:#ff9a4a;text-shadow:0 0 12px rgba(255,140,60,.6)}
.xpfloat{position:absolute;right:0;top:-2px;font-family:var(--f-mono);font-weight:700;font-size:13px;color:var(--spark);pointer-events:none;animation:xpup 1s ease-out forwards}
@keyframes xpup{0%{opacity:0;transform:translateY(6px)}20%{opacity:1}100%{opacity:0;transform:translateY(-22px)}}
.sheet-body{padding-block:10px calc(120px + env(safe-area-inset-bottom,0px))}
.qtags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tag{font-family:var(--f-mono);font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:7px;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--muted)}
.tag.new{background:var(--grad);color:#07110f;border:none}
.qtext{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.28;letter-spacing:-.015em;margin:0 0 18px;text-wrap:pretty}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:14px;border-radius:14px;border:1px solid var(--line-2);background:var(--surface);font-size:15.5px;line-height:1.4;min-height:54px;transition:border-color .15s,background .15s,transform .12s}
.opt:active:not([disabled]){transform:scale(.985)}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:rgba(255,255,255,.06);font-family:var(--f-mono);font-size:12.5px;font-weight:600;color:var(--muted)}
.opt span:last-child{min-width:0;padding-top:2px}
.opt:hover:not([disabled]){border-color:rgba(69,208,176,.55);background:var(--surface-2)}
.opt.right{border-color:var(--good);background:var(--good-soft);animation:okpulse .5s ease}
.opt.right .k{background:var(--good);color:#06150c}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);animation:shake .35s ease}
.opt.wrong .k{background:var(--bad);color:#200805}
.opt[disabled]{cursor:default}
.opt.dim{opacity:.45}
@keyframes okpulse{0%{box-shadow:0 0 0 0 rgba(95,213,142,.45)}100%{box-shadow:0 0 0 12px rgba(95,213,142,0)}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tf .opt{justify-content:center;font-weight:600}
.cardans{border:1px dashed var(--line-2);border-radius:14px;padding:16px;background:var(--surface);font-size:15.5px}
.fb{margin-top:16px;border-radius:16px;padding:14px 16px;border:1px solid var(--line-2);background:var(--surface);overflow:hidden}

<script>const BANK = [{"t":"mc","q":"What does Ordinary Least Squares choose its coefficient estimates to minimize?","o":["The sum of absolute residuals","The sum of squared residuals","The number of misclassified points","The variance of the predictors"],"a":1,"x":"OLS minimizes Σ(yᵢ − ŷᵢ)². Squaring gives a unique solution and penalizes large errors more heavily.","id":"m1-1","m":1,"s":"2.3","tr":"\"Sum of absolute residuals\" is what MAE measures and what least-absolute-deviations regression minimizes, not OLS. The \"squares\" in least squares is the clue."},{"t":"mc","q":"In the population model Y = β₀ + β₁X₁ + … + u, what does the error term u represent?","o":["The residual from the fitted sample model","Everything else that affects Y that the predictors don't capture","The intercept when all X's are zero","Measurement error in X only"],"a":1,"x":"u is the population error term: all other influences on Y. Residuals (y − ŷ) are its sample counterpart.","id":"m1-2","m":1,"s":"2.1","tr":"Don't mix up u (the population error, which you never observe) with the residual y − ŷ (computed from your sample). Residuals estimate u; they aren't u."},{"t":"mc","q":"What does the \"hat\" in β̂ or ŷ signal?","o":["A population parameter","A standardized value","An estimate computed from the sample","A squared quantity"],"a":2,"x":"Hats mark estimates. The true β values are unknown population parameters; β̂ are our best guesses from the sample.","id":"m1-3","m":1,"s":"2.2","tr":"β with no hat is the true population value. A hat always means \"estimated from data.\" ŷ is a prediction, not an observed y."},{"t":"card","q":"Write the OLS solution in matrix form.","x":"β̂ = (XᵀX)⁻¹XᵀY. It computes all coefficients at once from the normal equations.","id":"m1-4","m":1,"s":"2.4","tr":"Order matters: (XᵀX)⁻¹XᵀY. Writing (XXᵀ)⁻¹ or dropping the inverse is the usual slip. XᵀX must be invertible, which fails under perfect multicollinearity."},{"t":"mc","q":"Under the right assumptions, OLS is \"efficient.\" What does that mean?","o":["It converges as n grows","On average it equals the true value","It has the smallest variance among linear unbiased estimators","It is fast to compute"],"a":2,"x":"Efficient = smallest variance among linear unbiased estimators. Unbiased = right on average. Consistent = converges to the truth as n grows.","id":"m1-5","m":1,"s":"2.5","tr":"Three properties that are easy to swap. Unbiased: right on average. Consistent: converges to the truth as n grows. Efficient: smallest variance among linear unbiased estimators (the \"B\" in BLUE)."},{"t":"mc","q":"How do you interpret a slope coefficient in multiple regression?","o":["The correlation between X and Y","The change in Y for a one-unit increase in X, holding other variables constant","The percentage change in Y","The value of Y when X is zero"],"a":1,"x":"Each coefficient is a ceteris paribus effect: change in Y per one-unit change in that X, with the other predictors held fixed.","id":"m1-6","m":1,"s":"7.2","tr":"Forgetting \"holding other variables constant\" is the classic mistake. A slope isn't a correlation, and \"value of Y when X = 0\" describes the intercept, not a slope."},{"t":"tf","q":"A predictor with p < 0.05 is guaranteed to be practically important.","a":false,"x":"Statistical significance ≠ practical importance. A tiny effect can be significant in a large sample like the 20,640-row housing data.","id":"m1-7","m":1,"s":"7.3","tr":"p-values measure evidence that an effect isn't zero, not how big it is. With n = 20,640, even tiny effects come out significant."},{"t":"mc","q":"Why prefer adjusted R² over R² when comparing models with different numbers of predictors?","o":["Adjusted R² can exceed 1","R² always increases when you add predictors; adjusted R² penalizes extra variables","Adjusted R² uses the test set","R² ignores the intercept"],"a":1,"x":"Plain R² never decreases when you add a variable. Adjusted R² penalizes model size, so it is the fairer comparison.","id":"m1-8","m":1,"s":"7.4","tr":"Plain R² can never drop when you add a variable, so it rewards junk predictors. Only adjusted R² can go down."},{"t":"calc","q":"A model has SS_res = 40 and SS_tot = 100. What is R²?","o":["0.40","0.60","0.71","1.40"],"a":1,"x":"R² = 1 − SS_res/SS_tot = 1 − 40/100 = 0.60. The model explains 60% of the variation in Y.","id":"m1-9","m":1,"s":"9.2.4","tr":"0.40 is SS_res/SS_tot, the unexplained share. R² is one minus that."},{"t":"mc","q":"Which plot is the main visual check for the linearity assumption?","o":["Q–Q plot","Residuals vs fitted values","Histogram of Y","Correlation heatmap"],"a":1,"x":"Residuals vs fitted should look like random scatter around zero. Curves or systematic trends mean the linear form is missing something.","id":"m1-10","m":1,"s":"8.2","tr":"Each plot checks one thing. Residuals vs fitted: linearity. Q–Q plot: normality. Scale–location: constant variance. Don't swap them."},{"t":"mc","q":"Heteroskedasticity is present. What happens to the OLS coefficient estimates?","o":["They become biased","They stay unbiased, but standard errors are wrong","They become exactly zero","Nothing at all changes"],"a":1,"x":"Good news: β̂ stays unbiased. Bad news: standard errors are incorrect, so p-values and confidence intervals can't be trusted.","id":"m1-11","m":1,"s":"8.4","tr":"Many people think heteroskedasticity biases β̂. It doesn't. Bias comes from omitted variables or a wrong functional form. Heteroskedasticity breaks the standard errors."},{"t":"mc","q":"In the Breusch–Pagan test, what is the null hypothesis?","o":["Errors are normally distributed","Errors have constant variance (homoskedasticity)","Predictors are uncorrelated","The model is linear"],"a":1,"x":"H₀: homoskedasticity. H₁: heteroskedasticity. A small p-value means you reject constant variance.","id":"m1-12","m":1,"s":"8.4","tr":"H₀ is the \"good\" state (constant variance), so a small p-value means trouble. Don't mix it up with Jarque–Bera or Shapiro–Wilk, whose H₀ is normality."},{"t":"mc","q":"The normality assumption in OLS applies to which quantity?","o":["The response Y","The predictors X","The error terms u","The coefficients"],"a":2,"x":"Only the errors need to be normal, not Y and not the X's. Check with a Q–Q plot of residuals or a Jarque–Bera / Shapiro–Wilk test.","id":"m1-13","m":1,"s":"8.5","tr":"Checking a histogram of Y or the X's is the common mistake. Only the errors (estimated by the residuals) need to be normal."},{"t":"mc","q":"With over 20,000 observations, why do minor normality violations matter less?","o":["The Central Limit Theorem makes inference approximately valid","Large samples remove heteroskedasticity","R² becomes 1","Residuals become zero"],"a":0,"x":"In large samples the CLT makes the sampling distribution of β̂ approximately normal, so mild non-normal errors barely affect inference.","id":"m1-14","m":1,"s":"8.5","tr":"The CLT doesn't make residuals normal or fix heteroskedasticity. It makes the sampling distribution of β̂ approximately normal, which is what inference needs."},{"t":"mc","q":"Which normality test does the notebook recommend for smaller samples?","o":["Jarque–Bera","Shapiro–Wilk","Breusch–Pagan","Durbin–Watson"],"a":1,"x":"Shapiro–Wilk suits smaller samples. Jarque–Bera works well for larger samples.","id":"m1-15","m":1,"s":"8.5","tr":"Breusch–Pagan tests variance and Durbin–Watson tests time-order autocorrelation. Neither is a normality test."},{"t":"mc","q":"For cross-sectional housing data, how did the notebook check independence of errors?","o":["Plot residuals against time","Plot residuals against latitude and longitude to look for spatial clustering","Compute VIF","Run a Q–Q plot"],"a":1,"x":"With no time order, the risk is spatial dependence: nearby districts having similar errors. Plotting residuals on the map reveals clustering.","id":"m1-16","m":1,"s":"8.3","tr":"Residuals vs time (or Durbin–Watson) is for time series. For cross-sectional housing data, dependence is spatial, so plot residuals against latitude and longitude."},{"t":"calc","q":"Regressing X₃ on all other predictors gives R²ⱼ = 0.90. What is its VIF?","o":["0.9","1.1","9","10"],"a":3,"x":"VIF = 1/(1 − R²ⱼ) = 1/0.10 = 10. A VIF of 10 or more signals high multicollinearity.","id":"m1-17","m":1,"s":"8.6","tr":"VIF uses 1/(1 − R²ⱼ), not 1/R²ⱼ, which would give 1.1 here. And R²ⱼ comes from regressing Xⱼ on the other X's, not on Y."},{"t":"mc","q":"A VIF of 7 falls in which band?","o":["Ideal (no correlation)","Generally acceptable","Moderate concern, monitor it","High multicollinearity, act now"],"a":2,"x":"VIF = 1 ideal; < 5 acceptable; 5–10 moderate concern; ≥ 10 high multicollinearity.","id":"m1-18","m":1,"s":"8.6","tr":"Remember the two cutoffs: 5 and 10. From 5 up to 10 is moderate; 10 or more is high."},{"t":"mc","q":"Which is NOT a usual consequence of multicollinearity?","o":["Unstable coefficients","Inflated standard errors","Hard-to-isolate individual effects","Badly degraded predictions"],"a":3,"x":"Multicollinearity hurts interpretation and inference, but prediction accuracy is usually not affected much.","id":"m1-19","m":1,"s":"8.6","tr":"Multicollinearity is an inference and interpretation problem. It inflates standard errors and destabilizes coefficients, but it doesn't bias β̂ or wreck predictions."},{"t":"mc","q":"Which metric is more sensitive to large errors?","o":["MAE","RMSE","MAPE","They are equally sensitive"],"a":1,"x":"RMSE squares errors before averaging, so big misses dominate. MAE treats all errors linearly.","id":"m1-20","m":1,"s":"9.2.1","tr":"MAE is the outlier-robust metric. RMSE is always ≥ MAE, and the gap grows when you have a few big misses."},{"t":"mc","q":"When is MAPE problematic?","o":["When actual values are near zero","When the sample is large","When errors are normal","When R² is high"],"a":0,"x":"MAPE divides by yᵢ. Values near zero blow the percentage up. Its upside is being scale-free.","id":"m1-21","m":1,"s":"9.2.3","tr":"Being scale-free is MAPE's strength. Dividing by yᵢ is its weakness, because values near zero make the percentage blow up."},{"t":"calc","q":"Errors on three houses are +2, −2, and +4. What is the MAE?","o":["1.33","2.67","2.83","4"],"a":1,"x":"MAE = (|2| + |−2| + |4|)/3 = 8/3 ≈ 2.67. (RMSE would be √(24/3) = √8 ≈ 2.83.)","id":"m1-22","m":1,"s":"9.2.2","tr":"Dropping the absolute values gives (2 − 2 + 4)/3 = 1.33, the mean error (bias), not MAE. 2.83 is RMSE."},{"t":"mc","q":"Training R² is 0.85 but test R² is 0.45. What does this suggest?","o":["Good generalization","Overfitting","Underfitting","A lucky test split"],"a":1,"x":"A large drop from train to test means the model memorized the training data. Similar scores suggest good generalization.","id":"m1-23","m":1,"s":"10.4","tr":"Overfitting: train much better than test. Underfitting: both poor. Test better than train usually just means a lucky split."},{"t":"mc","q":"Why split data into training and test sets?","o":["To double the sample size","To get an honest estimate of performance on unseen data","To remove outliers","To satisfy homoskedasticity"],"a":1,"x":"Evaluating on the data used for fitting is overly optimistic. A held-out test set (20–30%) gives an honest estimate.","id":"m1-24","m":1,"s":"5.1","tr":"Splitting is about honest evaluation. It doesn't remove outliers or fix assumptions."},{"t":"card","q":"List the four core OLS assumptions (James et al.) covered in the notebook.","x":"1) Linearity, 2) Independence of errors, 3) Homoskedasticity (constant error variance), 4) Normality of errors. Multicollinearity is an extra diagnostic.","id":"m1-25","m":1,"s":"8.1","tr":"Multicollinearity isn't one of the four core assumptions here; it's an extra diagnostic. \"Y must be normal\" isn't an assumption at all."},{"t":"mc","q":"Why does statsmodels need sm.add_constant(X)?","o":["To scale features","To add the intercept term β₀","To remove missing values","To add interaction terms"],"a":1,"x":"statsmodels OLS doesn't include an intercept automatically, so you add a column of ones.","id":"m1-26","m":1,"s":"6.2","tr":"Forget it and statsmodels quietly fits a line through the origin. sklearn's LinearRegression adds the intercept for you; statsmodels' OLS does not."},{"m":1,"t":"code","s":"6.2","q":"Fill in the blank so statsmodels fits a model WITH an intercept.","c":"import statsmodels.api as sm\nX_train_const = ____(X_train)\nresults = sm.OLS(y_train, X_train_const).fit()","o":["sm.add_constant","np.ones_like","StandardScaler().fit_transform","sm.add_intercept"],"a":0,"x":"sm.add_constant adds a column of ones, so OLS estimates β₀.","tr":"sm.add_intercept doesn't exist. np.ones_like would replace your data with ones instead of adding a column.","id":"c1-1"},{"m":1,"t":"code","s":"8.4","q":"Which line tests for heteroskedasticity on the fitted model's residuals?","c":"residuals = results.resid\n____","o":["het_breuschpagan(residuals, X_train_const)","jarque_bera(residuals)","variance_inflation_factor(X_train.values, 0)","stats.shapiro(X_train)"],"a":0,"x":"het_breuschpagan returns (LM stat, LM p-value, F stat, F p-value). H₀ is constant variance.","tr":"jarque_bera tests normality, VIF measures multicollinearity, and Shapiro on X tests the wrong thing entirely.","id":"c1-2"},{"m":1,"t":"code","s":"10.2","q":"How do you get test-set predictions from a statsmodels OLS fit?","c":"X_test_const = sm.add_constant(X_test)\ny_pred = ____","o":["results.predict(X_test_const)","results.predict(X_test)","results.fittedvalues","results.fit(X_test_const)"],"a":0,"x":"predict needs the test matrix with the same constant column as in training.","tr":"Passing X_test without the constant gives a shape mismatch. fittedvalues are training-set predictions.","id":"c1-3"},{"t":"mc","q":"When OLS is applied to a binary 0/1 outcome, what is the model called?","o":["Logit model","Linear Probability Model (LPM)","Probit model","Poisson model"],"a":1,"x":"Because E[Y|X] = P(Y=1|X) for binary Y, an OLS fit models the probability linearly. That's the LPM.","id":"m2-1","m":2,"s":"1.1","tr":"Logit uses the logistic function and maximum likelihood. The LPM is just OLS run on a 0/1 outcome."},{"t":"mc","q":"In an LPM, β_age = −0.008. Interpret it.","o":["Each year of age lowers the odds of survival by 0.8%","Each year of age lowers survival probability by 0.8 percentage points, all else equal","Age has no effect","Each year of age lowers log-odds by 0.008"],"a":1,"x":"LPM coefficients are direct changes in probability: −0.008 = −0.8 percentage points per year, ceteris paribus.","id":"m2-2","m":2,"s":"1.2","tr":"LPM coefficients are in percentage points of probability, not odds or log-odds. 0.008 means 0.8 points, not 8%."},{"t":"calc","q":"An LPM is P = 0.2 + 0.1X. What does it predict at X = 10?","o":["0.30","1.00","1.20","Undefined"],"a":2,"x":"0.2 + 0.1(10) = 1.2, an impossible probability above 1. That's LPM problem #1.","id":"m2-3","m":2,"s":"2.1","tr":"Don't mentally cap it at 1.00. The point is that the LPM really does output 1.2."},{"t":"tf","q":"Capping LPM predictions above 1 at 1.0 fixes the model's statistical problems.","a":false,"x":"Capping hides the symptom. The model is still heteroskedastic, has non-normal errors, and assumes linear effects.","id":"m2-4","m":2,"s":"2.1","tr":"Capping only hides the symptom. Heteroskedasticity, non-normal errors, and constant marginal effects are all still there."},{"t":"mc","q":"Why is the LPM always heteroskedastic?","o":["Because Var(Y|X) = p(X)[1 − p(X)] depends on X","Because the sample is small","Because predictors are correlated","Because OLS is biased"],"a":0,"x":"For binary Y the variance is p(1−p), which changes with X through p(X). Constant variance is impossible.","id":"m2-5","m":2,"s":"2.2","tr":"It isn't about sample size or correlated predictors. It's built into binary data: Var = p(1 − p) changes as p changes."},{"t":"calc","q":"For a binary outcome, at what p is Var(Y|X) = p(1 − p) largest, and what is the value?","o":["p = 0, value 0","p = 0.5, value 0.25","p = 1, value 1","p = 0.5, value 0.5"],"a":1,"x":"p(1−p) peaks at p = 0.5, giving 0.25. It approaches 0 as p → 0 or 1.","id":"m2-6","m":2,"s":"2.2","tr":"The maximum variance is 0.25, not 0.5. 0.5 is the p where the maximum happens."},{"t":"mc","q":"Why are LPM errors non-normal?","o":["They can only take two values: 1 − p(X) or −p(X)","They are always positive","They follow a t-distribution","They depend on the sample size"],"a":0,"x":"u = Y − p(X), and Y is 0 or 1, so u takes just two values. A two-point distribution can't be normal.","id":"m2-7","m":2,"s":"2.3","tr":"The errors aren't just skewed; they're discrete, with only two possible values. That's why normal-theory inference fails."},{"t":"mc","q":"What does \"constant marginal effects\" mean as an LPM weakness?","o":["Effects are biggest at p = 0.5","A one-unit change in X shifts probability by the same β no matter the baseline probability","Effects are always zero","Coefficients are in log-odds"],"a":1,"x":"Real probability responses are S-shaped: biggest near p = 0.5, tiny near 0 or 1. The LPM's straight line can't capture that.","id":"m2-8","m":2,"s":"2.4","tr":"\"Largest at p = 0.5\" describes logistic regression's marginal effects. The LPM's effect is the same everywhere."},{"t":"card","q":"Write the logistic (sigmoid) function and three of its key properties.","x":"G(z) = 1/(1 + e^(−z)) = eᶻ/(1 + eᶻ). G(0) = 0.5; G(z) → 1 as z → +∞; G(z) → 0 as z → −∞; G′(z) = G(z)[1 − G(z)].","id":"m2-9","m":2,"s":"3.2","tr":"Watch the sign: 1/(1 + e^(−z)) rises with z. Using e^(+z) in the denominator flips the curve."},{"t":"calc","q":"What is G(0) for the logistic function?","o":["0","0.25","0.5","1"],"a":2,"x":"G(0) = 1/(1 + e⁰) = 1/2 = 0.5.","id":"m2-10","m":2,"s":"3.2","tr":"e⁰ = 1, not 0. So G(0) = 1/2."},{"t":"mc","q":"What is the logit (log-odds) of p?","o":["ln(p)","p/(1 − p)","ln(p/(1 − p))","1/(1 + e^(−p))"],"a":2,"x":"Odds = p/(1−p). Logit = ln(odds) = Xβ. The logit is linear in the predictors.","id":"m2-11","m":2,"s":"3.5","tr":"p/(1 − p) is the odds; the logit is its log. 1/(1 + e^(−·)) is the sigmoid, the inverse of the logit."},{"t":"calc","q":"If p = 0.75, what are the odds?","o":["0.75","1.33","3","4"],"a":2,"x":"Odds = p/(1−p) = 0.75/0.25 = 3, i.e. 3:1.","id":"m2-12","m":2,"s":"3.5","tr":"0.75 is the probability, not the odds. Odds = p/(1 − p) = 3, i.e. 3:1. 1.33 is 1/0.75, a different quantity."},{"t":"mc","q":"How is logistic regression estimated?","o":["OLS on 0/1 data","Maximum Likelihood Estimation, solved iteratively","A closed-form matrix formula","Gradient boosting"],"a":1,"x":"MLE using a Bernoulli likelihood. There's no closed form, so it's solved with Newton–Raphson or IRLS.","id":"m2-13","m":2,"s":"4.5","tr":"Logistic regression has no closed form like OLS's (XᵀX)⁻¹Xᵀy. Its first-order conditions are nonlinear, so it's solved iteratively."},{"t":"card","q":"Write the log-likelihood for logistic regression.","x":"ℓ(β) = Σ [ yᵢ ln(pᵢ) + (1 − yᵢ) ln(1 − pᵢ) ], with pᵢ = 1/(1 + e^(−Xᵢβ)). It comes from the Bernoulli pmf pᵢ^yᵢ (1−pᵢ)^(1−yᵢ).","id":"m2-14","m":2,"s":"4.4","tr":"It's a sum of logs, not a product, and the (1 − yᵢ)ln(1 − pᵢ) term is easy to forget."},{"t":"mc","q":"Which is NOT an asymptotic property of the MLE?","o":["Consistent","Asymptotically normal","Asymptotically efficient (reaches the Cramér–Rao bound)","Unbiased in every finite sample"],"a":3,"x":"MLE properties hold as n grows: consistency, asymptotic normality, asymptotic efficiency. Finite-sample unbiasedness isn't guaranteed.","id":"m2-15","m":2,"s":"4.6","tr":"MLE's guarantees are asymptotic: they kick in as n grows. Exact unbiasedness in small samples isn't promised."},{"t":"mc","q":"What does a logistic regression coefficient βⱼ directly measure?","o":["Change in probability per unit of Xⱼ","Change in log-odds per unit of Xⱼ","Change in odds per unit of Xⱼ","The odds ratio"],"a":1,"x":"βⱼ is the change in ln(odds). Exponentiate it to get the odds ratio; use marginal effects for probability changes.","id":"m2-16","m":2,"s":"5.1","tr":"Reading a logit β as a change in probability is the LPM habit creeping in. Logit β is in log-odds; exponentiate it for an odds ratio."},{"t":"calc","q":"A logistic coefficient is β = 0.693. What is the odds ratio?","o":["0.5","0.693","2.0","6.93"],"a":2,"x":"OR = e^0.693 ≈ 2.0. A one-unit increase in X doubles the odds.","id":"m2-17","m":2,"s":"5.2","tr":"0.693 is the coefficient, not the odds ratio. Exponentiate: e^0.693 ≈ 2."},{"t":"tf","q":"An odds ratio of 2.0 means the probability of the outcome doubles.","a":false,"x":"It doubles the odds, not the probability. Odds 1:3 (p = 0.25) doubled to 2:3 gives p = 0.40, not 0.50.","id":"m2-18","m":2,"s":"5.2","tr":"Odds and probability only roughly track each other when p is small. At moderate p, doubling the odds gives much less than double the probability."},{"t":"mc","q":"An odds ratio of 1.0 means…","o":["The odds double","The odds halve","No effect on the odds","The probability is 1"],"a":2,"x":"OR = e^β = 1 when β = 0, so there's no change in the odds.","id":"m2-19","m":2,"s":"5.2","tr":"No effect means OR = 1 (β = 0). An OR of 0 isn't \"no effect.\" ORs below 1 shrink the odds."},{"t":"card","q":"Give the marginal effect formula for logistic regression, and say where it is largest.","x":"∂P/∂Xⱼ = βⱼ · p(X) · [1 − p(X)]. Largest at p = 0.5; it shrinks toward 0 as p → 0 or 1.","id":"m2-20","m":2,"s":"5.3","tr":"In logit, the marginal effect isn't β itself. Multiply by p(1 − p), which peaks at 0.25 when p = 0.5."},{"t":"calc","q":"β = 0.8 and the current p = 0.5. What is the marginal effect?","o":["0.1","0.2","0.4","0.8"],"a":1,"x":"β·p·(1−p) = 0.8 × 0.5 × 0.5 = 0.2, i.e. +20 percentage points per unit (locally).","id":"m2-21","m":2,"s":"5.3","tr":"Multiply by p(1 − p) = 0.25, not by p = 0.5. Using p alone gives 0.4."},{"t":"mc","q":"How do AME and MEM differ?","o":["AME averages each observation's marginal effect; MEM evaluates it once at the mean of X","AME uses odds; MEM uses probabilities","They are identical","MEM is only for the LPM"],"a":0,"x":"AME = (1/n)Σ β·pᵢ(1−pᵢ). MEM = β·p̄(1−p̄), with p̄ computed at the mean X values.","id":"m2-22","m":2,"s":"5.4","tr":"AME averages each observation's own effect. MEM plugs in the average X. They differ because the logistic curve is nonlinear."},{"t":"mc","q":"Precision answers which question?","o":["Of all actual positives, how many did we catch?","Of all predicted positives, how many were actually positive?","Of all actual negatives, how many did we catch?","What fraction of all predictions were right?"],"a":1,"x":"Precision = TP/(TP + FP). Recall = TP/(TP + FN). Specificity = TN/(TN + FP).","id":"m2-23","m":2,"s":"1.9.2","tr":"Memory hook: Precision → Predicted positives. Recall → Real positives. Mixing these two up is the most common metric mistake."},{"t":"calc","q":"TP = 40, FP = 10, FN = 20, TN = 30. What is the recall?","o":["0.67","0.70","0.80","0.57"],"a":0,"x":"Recall = TP/(TP + FN) = 40/60 ≈ 0.67. Precision would be 40/50 = 0.80, accuracy 70/100 = 0.70.","id":"m2-24","m":2,"s":"1.9.2","tr":"0.80 is precision, TP/(TP + FP). 0.70 is accuracy. Recall divides by actual positives: TP + FN."},{"t":"mc","q":"In medical screening you don't want to miss sick patients. Which threshold strategy fits?","o":["A high threshold (e.g. 0.7) for high precision","A low threshold (e.g. 0.3) for high recall","Always 0.5","No threshold at all"],"a":1,"x":"Lowering the threshold flags more positives, which cuts false negatives and raises recall. Marketing usually goes the other way, favoring precision.","id":"m2-25","m":2,"s":"1.9.3","tr":"Lowering the threshold catches more positives (higher recall) but adds false alarms (lower precision). A high threshold does the opposite."},{"t":"mc","q":"A false positive is also called…","o":["Type I error","Type II error","A true negative","Specificity"],"a":0,"x":"FP = Type I (predicting a survivor who died). FN = Type II (missing an actual survivor).","id":"m2-26","m":2,"s":"1.9.1","tr":"Type I = false alarm (FP). Type II = a miss (FN). Picture a smoke alarm going off with no fire as Type I."},{"t":"mc","q":"Why use a stratified train–test split for the Titanic data?","o":["To keep the survival proportion the same in train and test","To make the test set larger","To remove missing ages","To balance the classes 50/50"],"a":0,"x":"Stratification preserves the class proportions in both sets, which matters for binary outcomes.","id":"m2-27","m":2,"s":"1.5","tr":"Stratifying keeps the original class proportions in each split. It doesn't rebalance to 50/50; that would be resampling."},{"t":"mc","q":"F1-score is the ___ of precision and recall.","o":["Arithmetic mean","Geometric mean","Harmonic mean","Product"],"a":2,"x":"F1 = 2PR/(P + R), the harmonic mean. It's a balanced metric when both FP and FN matter.","id":"m2-28","m":2,"s":"1.9.2","tr":"The harmonic mean punishes imbalance. Precision = 1 with recall = 0 gives F1 = 0, not 0.5 like an arithmetic mean would."},{"m":2,"t":"code","s":"4.7","q":"Fit a logistic regression with statsmodels.","c":"X_train_const = sm.add_constant(X_train)\nlogit_results = ____(y_train, X_train_const).fit()","o":["sm.Logit","sm.OLS","sm.Probit","LogisticRegression"],"a":0,"x":"sm.Logit fits logistic regression by MLE. sm.OLS on 0/1 data would be the LPM.","tr":"sklearn's LogisticRegression takes (X, y) in that order and adds an L2 penalty by default. It's also not from statsmodels.","id":"c2-1"},{"m":2,"t":"code","s":"5.5","q":"Turn logit coefficients into odds ratios.","c":"odds_ratios = ____(logit_results.params)","o":["np.exp","np.log","1 / (1 + np.exp(-x))","np.sqrt"],"a":0,"x":"OR = e^β, so exponentiate the coefficients (and the confidence interval bounds too).","tr":"The sigmoid turns a log-odds value into a probability, not into an odds ratio.","id":"c2-2"},{"m":2,"t":"code","s":"1.9.3","q":"Classify with a 0.3 threshold to favor recall.","c":"p = logit_results.predict(X_test_const)\ny_hat = ____","o":["(p > 0.3).astype(int)","(p < 0.3).astype(int)","np.round(p)","(p > 0.7).astype(int)"],"a":0,"x":"Predict 1 when the probability exceeds 0.3. A lower cutoff gives more positives and higher recall.","tr":"np.round is the default 0.5 cutoff, and 0.7 would favor precision instead.","id":"c2-3"},{"t":"card","q":"Name the three components that fully specify a GLM.","x":"1) Random component: Y follows an exponential-family distribution. 2) Systematic component: the linear predictor η = xᵀβ. 3) Link function: g(μ) = η connects the mean to η.","id":"m3-1","m":3,"s":"1.4.1","tr":"The link isn't the distribution. Also, \"linear\" refers to η being linear in β, even when g(μ) is nonlinear."},{"t":"mc","q":"What does the link function g do in a GLM?","o":["Picks the distribution of Y","Connects the mean μ of Y to the linear predictor η","Estimates the dispersion φ","Removes outliers"],"a":1,"x":"g(μᵢ) = ηᵢ = xᵢᵀβ. It maps the constrained mean (e.g. a probability in (0,1)) onto the whole real line.","id":"m3-2","m":3,"s":"1.4.1","tr":"The random component picks the distribution. The link only connects μ to η."},{"t":"mc","q":"Match the canonical link to the binomial distribution.","o":["Identity","Log","Logit","Inverse"],"a":2,"x":"Normal → identity, Binomial → logit, Poisson → log.","id":"m3-3","m":3,"s":"1.4.2","tr":"Pairs to memorize: Normal–identity, Binomial–logit, Poisson–log. Log is Poisson's link, not the binomial's."},{"t":"mc","q":"Which canonical link does Poisson regression use?","o":["Identity","Log","Logit","Probit"],"a":1,"x":"log(λ) = xᵀβ, so λ = e^(xᵀβ), which keeps the expected count positive.","id":"m3-4","m":3,"s":"1.7.1","tr":"The logit maps (0, 1) probabilities to ℝ. Counts are positive, not bounded at 1, so Poisson uses the log."},{"t":"tf","q":"Logistic regression is a special case of a GLM with a binomial family and a logit link.","a":true,"x":"sklearn LogisticRegression and statsmodels GLM(Binomial, logit) gave identical estimates, standard errors, and predictions in the Titanic demo (when sklearn is unpenalized).","id":"m3-5","m":3,"s":"1.6.1","tr":"Same model. When sklearn's numbers differ, it's because LogisticRegression adds an L2 penalty by default, not because the theory differs."},{"t":"mc","q":"A Gaussian GLM with an identity link is mathematically equivalent to…","o":["Logistic regression","OLS","Poisson regression","Ridge regression"],"a":1,"x":"Its MLE is β̂ = (XᵀX)⁻¹Xᵀy with Var(β̂) = σ²(XᵀX)⁻¹, exactly OLS.","id":"m3-6","m":3,"s":"1.5.4","tr":"Ridge adds a penalty; a Gaussian GLM doesn't. With the identity link, the MLE is exactly OLS."},{"t":"card","q":"Write the general exponential-family density used for GLMs.","x":"f(y|θ,φ) = exp[ (yθ − b(θ))/a(φ) + c(y,φ) ]. θ = natural parameter, φ = dispersion, b = cumulant function, a = dispersion function, c = normalizer.","id":"m3-7","m":3,"s":"1.2.1","tr":"a(φ) divides only (yθ − b(θ)). c(y, φ) sits outside that fraction."},{"t":"mc","q":"For an exponential-family distribution, E[Y] equals…","o":["b(θ)","b′(θ)","a(φ)b″(θ)","θ²/2"],"a":1,"x":"Mean = b′(θ). Variance = a(φ)·b″(θ).","id":"m3-8","m":3,"s":"1.2.2","tr":"b(θ) itself is the cumulant function, not the mean. Mean = b′(θ). Variance = a(φ)·b″(θ)."},{"t":"mc","q":"What is the variance function V(μ) for the Poisson distribution?","o":["1","μ","μ(1 − μ)","μ²"],"a":1,"x":"Poisson: V(μ) = μ, so variance equals the mean. Normal: V = 1. Bernoulli: V = π(1 − π).","id":"m3-9","m":3,"s":"1.7.3","tr":"μ(1 − μ) is the Bernoulli variance function and 1 is the Normal's. Poisson's variance equals its mean."},{"t":"mc","q":"For the normal distribution in exponential-family form, what is V(μ)?","o":["1","μ","σ²","μ(1−μ)"],"a":0,"x":"b(θ) = θ²/2, so b″(θ) = 1. The variance σ² enters via a(φ), not V(μ).","id":"m3-10","m":3,"s":"1.5.2","tr":"σ² enters through a(φ), so V(μ) = 1, not σ². That's why Normal variance doesn't depend on the mean."},{"t":"mc","q":"For the Bernoulli GLM, what is the natural parameter θ?","o":["π","log(π)","The log-odds log(π/(1−π))","1/π"],"a":2,"x":"Writing the Bernoulli pmf in exponential form gives θ = log(π/(1 − π)). That's why the logit is the canonical link.","id":"m3-11","m":3,"s":"1.6.3","tr":"θ isn't π. It's the log-odds, which is exactly why the logit is the canonical link."},{"t":"mc","q":"What algorithm do GLMs use to find the MLE?","o":["Closed-form normal equations","Iteratively Reweighted Least Squares (IRLS), a Newton–Raphson variant","K-means","Gradient boosting"],"a":1,"x":"The score equations are nonlinear. IRLS repeatedly solves a weighted least squares problem β = (XᵀWX)⁻¹XᵀWz with an updated working response z.","id":"m3-12","m":3,"s":"1.3.4","tr":"Only the Gaussian/identity GLM has a closed-form OLS solution. Every other GLM needs iterations: Newton–Raphson or IRLS."},{"t":"mc","q":"In IRLS for logistic regression, what are the weights wᵢ?","o":["1","λᵢ","πᵢ(1 − πᵢ)","yᵢ"],"a":2,"x":"wᵢ = πᵢ(1 − πᵢ), the Bernoulli variance. For Poisson the weights are λᵢ.","id":"m3-13","m":3,"s":"1.6.5","tr":"λᵢ are Poisson's IRLS weights. Logistic weights are the Bernoulli variance πᵢ(1 − πᵢ)."},{"t":"card","q":"Score function for logistic regression?","x":"sⱼ(β) = Σ xᵢⱼ (yᵢ − πᵢ). Setting it to 0 gives the MLE. For Poisson it's Σ xᵢⱼ (yᵢ − λᵢ).","id":"m3-14","m":3,"s":"1.6.4","tr":"With the canonical logit link, the score is simply Σ x(y − π). Nothing is divided by the variance; the canonical link cancels it."},{"t":"mc","q":"Which is a benefit of using a canonical link?","o":["The MLE always has a closed form","Xᵀy is a sufficient statistic for β and IRLS simplifies","The model never overfits","Variance is constant"],"a":1,"x":"Canonical links give: unique MLEs (under regularity), W = W* in IRLS, Xᵀy sufficient for β, and better numerical stability.","id":"m3-15","m":3,"s":"1.4.2","tr":"Canonical links don't give closed forms; you still need IRLS. They give nice properties: Xᵀy is sufficient, and the MLE is unique and stable."},{"t":"calc","q":"A Poisson GLM coefficient is β = 0.10. By what factor does the expected count change per unit of x?","o":["×0.10","×1.105","×2.0","×10"],"a":1,"x":"Rate ratio = e^0.10 ≈ 1.105, about a 10.5% increase. For small β, e^β ≈ 1 + β.","id":"m3-16","m":3,"s":"1.7.6","tr":"β = 0.10 doesn't mean ×0.10. Effects are multiplicative: e^0.1 ≈ 1.105, about +10.5%."},{"t":"mc","q":"How is deviance defined?","o":["2[ℓ_saturated − ℓ_fitted]","ℓ_fitted − ℓ_null","Σ(yᵢ − ȳ)²","−2ℓ + 2p"],"a":0,"x":"Deviance compares the fitted model to the saturated model, which has one parameter per observation and fits perfectly.","id":"m3-17","m":3,"s":"1.8.1","tr":"−2ℓ + 2p is AIC. Deviance compares your fit with the saturated (perfect-fit) model."},{"t":"mc","q":"For a Gaussian GLM, deviance reduces to…","o":["The log-likelihood","The sum of squared residuals scaled by σ²","The number of parameters","Accuracy"],"a":1,"x":"D = Σ(yᵢ − μ̂ᵢ)²/σ². That's the GLM version of the residual sum of squares.","id":"m3-18","m":3,"s":"1.8.2","tr":"Deviance isn't the raw log-likelihood. For the Gaussian it's the residual sum of squares scaled by σ²."},{"t":"calc","q":"A Poisson GLM has deviance D = 900 with n − p = 300. What does D/(n − p) suggest?","o":["Good fit (≈ 1)","Overdispersion (≫ 1)","Underfitting of the mean only","Perfect fit"],"a":1,"x":"900/300 = 3, far above 1. Adequate fit has D/(n−p) ≈ 1; values ≫ 1 signal overdispersion.","id":"m3-19","m":3,"s":"1.8.4","tr":"A large deviance ratio isn't a \"stronger\" model. Near 1 is good; much bigger than 1 means the data vary more than the model allows (overdispersion)."},{"t":"mc","q":"How do Pearson residuals standardize yᵢ − μ̂ᵢ?","o":["Divide by √V(μ̂ᵢ)","Divide by n","Take the log","Multiply by the hat value"],"a":0,"x":"r_P = (y − μ̂)/√V(μ̂). Deviance residuals are sign(y − μ̂)√dᵢ, and their squares sum to D.","id":"m3-20","m":3,"s":"1.8.3","tr":"Deviance residuals are sign(y − μ̂)·√dᵢ. Pearson residuals divide by √V(μ̂). Easy to swap."},{"t":"mc","q":"AIC vs BIC: which statement is true?","o":["Higher is better for both","BIC penalizes complexity more heavily (p·log n vs 2p)","AIC always picks simpler models","They ignore the likelihood"],"a":1,"x":"AIC = −2ℓ + 2p; BIC = −2ℓ + p·log(n). Lower is better. BIC's heavier penalty favors simpler models.","id":"m3-21","m":3,"s":"1.8.5","tr":"Lower is better for both. BIC's log(n) exceeds 2 once n ≥ 8, so in practice BIC penalizes extra parameters more."},{"t":"mc","q":"Which is NOT one of the classical linear model's limitations that GLMs fix?","o":["Response must be normal","Constant variance","Unbounded predictions","It needs a train–test split"],"a":3,"x":"GLMs fix the distributional restriction, constant variance, unbounded predictions, and the forced linear mean via families, links, and mean-dependent variance.","id":"m3-22","m":3,"s":"1.1.1","tr":"Train–test splitting is evaluation practice that applies to any model. It isn't one of the limitations GLMs were built to fix."},{"t":"card","q":"How is the variance tied to the mean in a GLM?","x":"Var(Y|x) = φ · V(μ). The variance function V depends on the family: 1 (Normal), π(1−π) (Bernoulli), μ (Poisson).","id":"m3-23","m":3,"s":"1.1.3","tr":"In OLS the variance is constant (σ²). In a GLM it's tied to the mean through V(μ). That's what fixes binary and count data."},{"t":"card","q":"Interpret a Poisson coefficient βⱼ two ways.","x":"Log-rate: one unit of xⱼ changes log(λ) by βⱼ. Rate ratio: one unit of xⱼ multiplies the expected count by e^βⱼ.","id":"m3-24","m":3,"s":"1.7.6","tr":"β isn't the change in the count; it's the change in log(λ). Effects on the count are multiplicative via e^β."},{"t":"mc","q":"Which property must every valid link function have?","o":["It is the identity","It is monotonic (invertible) and differentiable","It maps to [0, 1]","It equals the variance function"],"a":1,"x":"Requirements: monotonic (g′ ≠ 0, so μ = g⁻¹(η) exists), maps the range of μ onto ℝ, and is differentiable for IRLS convergence.","id":"m3-25","m":3,"s":"1.4.3","tr":"A link doesn't map to [0, 1]. It maps the mean's allowed range onto all of ℝ, and its inverse maps back."},{"m":3,"t":"code","s":"3","q":"Fit logistic regression as a GLM in statsmodels.","c":"glm_binomial = sm.GLM(y_train, X_train_sm,\n                      family=____).fit()","o":["sm.families.Binomial()","sm.families.Poisson()","sm.families.Gaussian()","'logit'"],"a":0,"x":"The binomial family with its default canonical logit link is logistic regression.","tr":"Poisson is for counts, and Gaussian with an identity link would be OLS. family takes a family object, not a string.","id":"c3-1"},{"m":3,"t":"code","s":"5","q":"Check a fitted GLM for overdispersion.","c":"ratio = glm.deviance / ____","o":["glm.df_resid","glm.nobs","glm.aic","len(glm.params)"],"a":0,"x":"Deviance divided by residual degrees of freedom (n − p). Values near 1 are fine; values much bigger than 1 mean overdispersion.","tr":"Dividing by nobs ignores the parameters you used. AIC is a different statistic entirely.","id":"c3-2"},{"t":"mc","q":"Why is KNN called a \"lazy\" learner?","o":["It uses few features","It does no real training (O(1)) and does the work at prediction time","It only predicts the majority class","It ignores distances"],"a":1,"x":"KNN just stores the training set. Prediction costs O(n·p) for a brute-force neighbor search.","id":"m4-1","m":4,"s":"1.1.5","tr":"Lazy doesn't mean slow to train. Training is instant (O(1)); prediction, which searches all n points, is the expensive part."},{"t":"mc","q":"KNN is described as non-parametric and…","o":["Model-based","Instance-based","Likelihood-based","Gradient-based"],"a":1,"x":"It predicts directly from stored training instances rather than learning a fixed set of parameters.","id":"m4-2","m":4,"s":"1.1.1","tr":"Non-parametric doesn't mean no hyperparameters: k and the distance metric still need choosing."},{"t":"calc","q":"Points (1, 2) and (4, 6). What is the Euclidean distance?","o":["5","7","√7","25"],"a":0,"x":"√((4−1)² + (6−2)²) = √(9 + 16) = 5. The Manhattan distance would be 3 + 4 = 7.","id":"m4-3","m":4,"s":"1.1.2","tr":"7 is the Manhattan distance and 25 is forgetting the square root. Euclidean = √(3² + 4²) = 5."},{"t":"calc","q":"Points (1, 2) and (4, 6). What is the Manhattan distance?","o":["5","7","12","3.5"],"a":1,"x":"Manhattan (L1) = |4−1| + |6−2| = 3 + 4 = 7.","id":"m4-4","m":4,"s":"1.1.2","tr":"Manhattan sums absolute differences: no squaring, no square root."},{"t":"mc","q":"Minkowski distance with p = 2 is…","o":["Manhattan","Euclidean","Chebyshev","Cosine"],"a":1,"x":"(Σ|xᵢ − xⱼ|^p)^(1/p): p = 1 gives Manhattan, p = 2 gives Euclidean.","id":"m4-5","m":4,"s":"1.1.2","tr":"p = 1 is Manhattan, p = 2 is Euclidean, and p → ∞ is Chebyshev."},{"t":"mc","q":"How does KNN regression make a prediction?","o":["Majority vote of the neighbors","Average of the k nearest neighbors' y values","The single nearest point","A linear fit through the neighbors"],"a":1,"x":"ŷ = (1/k)Σyᵢ over the neighbors. Weighted KNN uses weights like 1/(d + ε), so closer points count more.","id":"m4-6","m":4,"s":"1.1.4","tr":"Majority vote is for classification. Regression averages the neighbors' y values (or weights them by 1/distance)."},{"t":"mc","q":"Why must features be scaled before KNN?","o":["To speed up training","Distance is dominated by features with large ranges (like Fare vs Age)","Trees require it","To remove outliers"],"a":1,"x":"KNN is distance-based. Unscaled, a feature measured in hundreds swamps one measured in units. Decision trees don't need scaling.","id":"m4-7","m":4,"s":"3","tr":"Trees don't need scaling. Anything distance- or penalty-based does: KNN, K-Means, DBSCAN, PCA, Ridge, Lasso."},{"t":"calc","q":"With k = 5 neighbors labeled [1, 1, 0, 1, 0], what is the estimated P(Y = 1)?","o":["0.4","0.5","0.6","1"],"a":2,"x":"P(Y = c) = (1/k)Σ1[yᵢ = c] = 3/5 = 0.6. The majority vote predicts class 1.","id":"m4-8","m":4,"s":"1.1.3","tr":"The probability is the fraction of neighbors in that class (3/5), not the predicted label itself."},{"t":"mc","q":"What does the curse of dimensionality do to distances?","o":["Distances grow more varied","All points become nearly equidistant: (d_max − d_min)/d_min → 0","Distances become exactly zero","It has no effect on KNN"],"a":1,"x":"Distance concentration: in high dimensions the nearest and farthest points are about the same distance away, so \"nearest neighbor\" loses meaning.","id":"m4-9","m":4,"s":"1.4.2","tr":"Distances don't spread out in high dimensions; they bunch together. That's distance concentration."},{"t":"mc","q":"To keep a fixed resolution δ in p dimensions, how does the required sample size grow?","o":["Linearly in p","Logarithmically","Exponentially: n ∝ (1/δ)^p","It stays constant"],"a":2,"x":"Sample needs grow exponentially with dimension, quickly becoming infeasible.","id":"m4-10","m":4,"s":"1.4.3","tr":"Linear intuition fails here. Each extra dimension multiplies the data you need, so growth is exponential in p."},{"t":"mc","q":"Which is NOT a mitigation for the curse of dimensionality in KNN?","o":["PCA","Feature selection","Adding more irrelevant features","Learning a task-specific distance metric"],"a":2,"x":"Irrelevant features make it worse by dominating distance calculations. PCA, feature selection or weighting, and metric learning help.","id":"m4-11","m":4,"s":"1.4.4","tr":"More features isn't more information for KNN. Irrelevant ones add noise to every distance."},{"t":"calc","q":"A binary node has p = 0.5 of each class. What is its Gini impurity?","o":["0","0.25","0.5","1"],"a":2,"x":"Binary Gini = 2p(1−p) = 2 × 0.5 × 0.5 = 0.5, the maximum for two classes.","id":"m4-12","m":4,"s":"1.3.1","tr":"For two classes, Gini maxes out at 0.5 and entropy at 1 bit. Don't swap the maxima."},{"t":"calc","q":"A node has 80% class A and 20% class B. What is the Gini impurity?","o":["0.16","0.32","0.5","0.8"],"a":1,"x":"G = 1 − (0.8² + 0.2²) = 1 − 0.68 = 0.32.","id":"m4-13","m":4,"s":"1.3.1","tr":"Compute 1 − (0.8² + 0.2²) = 0.32. 0.8 × 0.2 = 0.16 is half of 2p(1 − p); don't forget the 2."},{"t":"calc","q":"Entropy (base 2) of a node with a 50/50 class split?","o":["0","0.5","1","2"],"a":2,"x":"H = −(0.5 log₂0.5 + 0.5 log₂0.5) = 1 bit, the maximum uncertainty for two classes.","id":"m4-14","m":4,"s":"1.3.1","tr":"Entropy for a 50/50 binary node is 1 bit. 0.5 is the Gini maximum, not entropy's."},{"t":"mc","q":"What does information gain measure?","o":["Parent entropy minus the weighted average entropy of the children","Gini of the parent","The number of leaves","Accuracy after splitting"],"a":0,"x":"IG(S, A) = H(S) − Σ(|Sᵥ|/|S|)H(Sᵥ). C4.5's gain ratio divides IG by SplitInfo to penalize many-way splits.","id":"m4-15","m":4,"s":"1.3.1","tr":"Children are weighted by their share of samples. Gain ratio exists to fix plain IG's bias toward many-valued attributes."},{"t":"mc","q":"Gini vs entropy in practice: which is true?","o":["Entropy is faster to compute","Gini is faster (no logarithms), and both usually give similar splits","Gini can't be used for binary problems","Entropy always gives better accuracy"],"a":1,"x":"Gini avoids logs, so it's faster. Entropy tends toward more balanced trees, but results are usually very similar.","id":"m4-16","m":4,"s":"1.3.3","tr":"Entropy isn't usually more accurate; the two give similar splits. Gini's advantage is speed, because it needs no logarithms."},{"t":"mc","q":"What splitting criterion do regression trees typically use?","o":["Gini","Entropy","MSE reduction","Accuracy"],"a":2,"x":"They pick the split that most reduces the weighted MSE around each child's mean. MAE (around the median) is an alternative.","id":"m4-17","m":4,"s":"1.3.2","tr":"Gini and entropy are for classification. Regression trees use MSE (or MAE) reduction."},{"t":"mc","q":"How does recursive binary splitting choose a split?","o":["Randomly","By picking the feature j and threshold t that best reduce the impurity criterion, then repeating on each child","By clustering","By picking the feature with the most categories"],"a":1,"x":"It's a greedy, top-down process: at each node, test every (j, t) pair, choose the best, recurse until a stopping rule hits.","id":"m4-18","m":4,"s":"1.2.2","tr":"It's greedy: the best split right now, not a search for the globally best tree."},{"t":"mc","q":"An unpruned decision tree typically has…","o":["High bias, low variance","Low bias, high variance","High bias, high variance","Low bias, low variance"],"a":1,"x":"Deep trees can memorize the training data: near-perfect training accuracy but poor generalization. That's high variance.","id":"m4-19","m":4,"s":"1.5.1","tr":"Deep trees overfit, which means high variance, not high bias. Pruning trades a bit of bias for lower variance."},{"t":"card","q":"Write the cost-complexity pruning objective and explain α.","x":"C_α(T) = Σ N_m Q_m(T) + α|T|. The first term is leaf impurity; |T| is the number of leaves. Larger α penalizes size more, giving smaller trees. Choose α* by cross-validation.","id":"m4-20","m":4,"s":"1.5.2","tr":"Larger α means a smaller tree. α = 0 keeps the full tree. Pick α* by cross-validation, not by training error."},{"t":"mc","q":"Which is pre-pruning (early stopping) rather than post-pruning?","o":["Cost-complexity pruning","Setting max_depth or min_samples_leaf before growing the tree","Reduced error pruning","Growing the full tree, then cutting back"],"a":1,"x":"Pre-pruning stops growth early using limits. Post-pruning (cost-complexity, reduced error) grows the full tree and then trims it.","id":"m4-21","m":4,"s":"1.5.3","tr":"Cost-complexity and reduced-error pruning are post-pruning. max_depth and min_samples_leaf stop growth early (pre-pruning)."},{"t":"mc","q":"In reduced error pruning, when is a subtree replaced by a leaf?","o":["When the training error drops","When the error on a separate pruning set stays the same or improves","Always","When the depth exceeds 3"],"a":1,"x":"If error_after ≤ error_before on the held-out pruning set, the simpler leaf wins.","id":"m4-22","m":4,"s":"1.5.4","tr":"Judge on a separate pruning set. Training error always prefers the bigger tree."},{"t":"tf","q":"Decision trees need feature scaling to work well.","a":false,"x":"Trees split on thresholds of single features, so scale doesn't matter. They also handle mixed feature types naturally, unlike KNN.","id":"m4-23","m":4,"s":"2","tr":"KNN needs scaling; trees don't. Splits compare one feature to a threshold, so units never mix."},{"t":"mc","q":"Small k vs large k in KNN: which is true?","o":["Small k means a smoother boundary and high bias","Small k means a flexible boundary and high variance; large k means smoother and higher bias","k has no effect","Large k always overfits"],"a":1,"x":"k = 1 fits noise (high variance). Very large k averages too broadly (high bias). Choose k by cross-validation.","id":"m4-24","m":4,"s":"5","tr":"Small k means high variance (it chases noise), not high bias. Choose k with cross-validation."},{"m":4,"t":"code","s":"3","q":"Scale features for KNN without leaking test information.","c":"scaler = StandardScaler()\nX_train_s = scaler.fit_transform(X_train)\nX_test_s  = ____","o":["scaler.transform(X_test)","scaler.fit_transform(X_test)","StandardScaler().fit_transform(X_test)","X_test"],"a":0,"x":"Fit on train only, then apply the same mean and standard deviation to test.","tr":"Calling fit_transform on test re-fits to the test data. That's leakage, and it puts train and test on different scales.","id":"c4-1"},{"m":4,"t":"code","s":"4","q":"Grow a tree that uses entropy and is pre-pruned to depth 4.","c":"dt = DecisionTreeClassifier(____, random_state=42)","o":["criterion='entropy', max_depth=4","criterion='gini', max_depth=4","splitter='entropy', depth=4","criterion='entropy', ccp_alpha=4"],"a":0,"x":"criterion picks the impurity measure; max_depth is a pre-pruning limit.","tr":"ccp_alpha is cost-complexity (post-)pruning, and a value like 4 would prune almost everything. 'splitter' chooses best vs random splits.","id":"c4-2"},{"t":"mc","q":"What does \"bagging\" stand for?","o":["Bayesian aggregation","Bootstrap aggregating","Batch gradient","Balanced sampling"],"a":1,"x":"Bootstrap AGGregatING: train models on bootstrap samples and aggregate their predictions.","id":"m5-1","m":5,"s":"2.1","tr":"It isn't boosting. Bagging = Bootstrap sampling + AGGregatING."},{"t":"mc","q":"What makes a bootstrap sample a bootstrap sample?","o":["Sampling n rows without replacement","Sampling n rows with replacement","Taking the first 80% of rows","Sampling features only"],"a":1,"x":"With replacement: some rows appear several times and some not at all, so each sample differs.","id":"m5-2","m":5,"s":"2.1","tr":"Sampling n rows without replacement just gives back the original dataset. The replacement creates the diversity."},{"t":"calc","q":"About what fraction of the original rows are left out of a bootstrap sample when n is large?","o":["10%","25%","36.8%","50%"],"a":2,"x":"((n−1)/n)ⁿ → 1/e ≈ 0.368. About 63.2% of rows appear at least once.","id":"m5-3","m":5,"s":"3.3","tr":"Two numbers that are easy to flip: about 63.2% of rows appear in a bootstrap sample and about 36.8% are left out (out-of-bag)."},{"t":"mc","q":"How does bagging combine predictions for classification?","o":["Average of probabilities only","Majority vote","Weighted by tree depth","Pick the best tree"],"a":1,"x":"Classification uses a majority vote. Regression averages the predictions.","id":"m5-4","m":5,"s":"2.3","tr":"Averaging is for regression. Classification takes the majority vote."},{"t":"mc","q":"Bagging helps most with which kind of base model?","o":["High-bias, low-variance (like linear regression)","Low-bias, high-variance (like deep trees)","Any model equally","Models with no variance"],"a":1,"x":"Averaging cancels variance. Stable models like linear regression produce near-identical bootstrap fits, so there's little to gain.","id":"m5-5","m":5,"s":"2.4","tr":"Bagging a stable model like linear regression barely helps. The gain comes from averaging away the jumpiness of deep trees."},{"t":"mc","q":"What does bagging do to bias?","o":["Reduces it substantially","Leaves it about the same","Doubles it","Removes it entirely"],"a":1,"x":"Averaging keeps the expected prediction the same, so bias stays put. If the base models are biased, the ensemble is too.","id":"m5-6","m":5,"s":"3.2","tr":"Bagging reduces variance, not bias. Boosting is the one that attacks bias."},{"t":"card","q":"Variance of an average of B models, each with variance σ² and pairwise correlation ρ?","x":"ρσ² + ((1 − ρ)/B)σ². As B grows, the second term vanishes, leaving ρσ². Lower correlation gives a lower floor. With independent models (ρ = 0) it's σ²/B.","id":"m5-7","m":5,"s":"3.2","tr":"With ρ > 0, even infinite trees leave ρσ². That's why decorrelating the trees matters more than adding more of them."},{"t":"calc","q":"Trees have σ² = 1 and ρ = 0.5. What does ensemble variance approach as B → ∞?","o":["0","0.25","0.5","1"],"a":2,"x":"ρσ² + (1−ρ)σ²/B → ρσ² = 0.5. More trees can't beat the correlation floor; decorrelating the trees can.","id":"m5-8","m":5,"s":"7.3","tr":"It isn't 0. The term (1 − ρ)σ²/B vanishes as B grows, but ρσ² stays."},{"t":"mc","q":"What extra randomness does Random Forest add on top of bagging?","o":["Random row weights","At each split, only a random subset of m features is considered","Random tree depth","Random labels"],"a":1,"x":"Feature subsampling at each split keeps one dominant feature from appearing at the top of every tree. That decorrelates the trees.","id":"m5-9","m":5,"s":"4.2","tr":"Random Forest samples features at every split, not once per tree. That detail is what decorrelates the trees."},{"t":"calc","q":"A classification problem has p = 16 features. What is the typical Random Forest m?","o":["2","4","8","16"],"a":1,"x":"m = √p = √16 = 4 features considered at each split (for classification).","id":"m5-10","m":5,"s":"4.2","tr":"√p is the classification default. For regression, p/3 is common."},{"t":"mc","q":"Why does random feature selection improve performance?","o":["It lowers bias","It lowers the correlation ρ between trees, so averaging removes more variance","It makes each tree more accurate","It speeds up prediction only"],"a":1,"x":"Lower ρ lowers the ensemble variance floor ρσ².","id":"m5-11","m":5,"s":"4.3","tr":"RF doesn't make each tree more accurate (often slightly worse). It makes the trees less alike, so averaging cancels more error."},{"t":"tf","q":"In Random Forest, individual trees are usually heavily pruned.","a":false,"x":"Trees are grown deep (until a minimum node size) and left unpruned. Low bias per tree, with variance handled by averaging.","id":"m5-12","m":5,"s":"4.4","tr":"Trees in a forest are grown deep and left unpruned. Low bias per tree; the averaging handles variance."},{"t":"mc","q":"What is out-of-bag (OOB) error?","o":["Error on a separate 20% test split","Each row is predicted only by trees that didn't see it in training, then those errors are averaged","Training error","Error on bootstrap rows"],"a":1,"x":"About 36.8% of rows are OOB for each tree. That gives a near-unbiased validation estimate without holding out data.","id":"m5-13","m":5,"s":"6.2","tr":"OOB isn't training error. Each row is predicted only by the trees that never saw it."},{"t":"mc","q":"Which is an advantage of OOB error estimation?","o":["You use 100% of the data for training and still get a validation estimate","It requires a separate test set","It only works for regression","It has to be computed after deployment"],"a":0,"x":"No data is lost to a holdout. OOB is nearly as accurate as leave-one-out CV and can guide the number of trees and mtry.","id":"m5-14","m":5,"s":"6.4","tr":"The appeal is that no holdout set is needed: all your data trains the model, and you still get a validation estimate."},{"t":"mc","q":"How is Mean Decrease in Impurity (MDI) importance computed?","o":["Shuffle a feature and measure the accuracy drop","Sum the impurity reduction from each feature's splits (weighted by node size), averaged over trees","Count how often a feature appears","Use the coefficient size"],"a":1,"x":"MDI = (1/B)ΣΣ p(t)Δi(sₜ, t) over the splits that use feature j. It's fast and available right after training.","id":"m5-15","m":5,"s":"5.2","tr":"MDI is impurity-based and computed during training. Permutation importance measures the accuracy drop when a feature is shuffled."},{"t":"mc","q":"What is a known weakness of MDI importance?","o":["It's slow","It's biased toward high-cardinality features and misleading with correlated features","It needs a test set","It only works for linear models"],"a":1,"x":"Features with many possible split points get inflated MDI scores. Use permutation importance for final interpretation.","id":"m5-16","m":5,"s":"5.4","tr":"IDs and ticket numbers can score high MDI simply because they offer many split points. Check them with permutation importance."},{"t":"mc","q":"How does permutation importance measure a feature?","o":["Removing it and retraining","Shuffling its values in OOB/test data and measuring the accuracy drop","Counting splits","Squaring its coefficient"],"a":1,"x":"Bigger drop = more important. It's more reliable, works with any model, but is slower.","id":"m5-17","m":5,"s":"5.3","tr":"You shuffle the feature; you don't delete it and retrain. That would be drop-column importance, a different and slower method."},{"t":"card","q":"Write the three-part decomposition of expected prediction error.","x":"Expected error = Bias² + Variance + Irreducible error. Bias is systematic misses; variance is sensitivity to the training set; irreducible error is noise no model can remove.","id":"m5-18","m":5,"s":"3.1","tr":"Bias is squared in the formula, and irreducible error can't be reduced by any model."},{"t":"mc","q":"Which analogy matches high variance?","o":["Darts consistently left of the bullseye","Darts scattered all over the board","Wind pushing the darts","A perfectly centered cluster"],"a":1,"x":"Scattered = high variance. Consistently off = high bias. Wind = irreducible error.","id":"m5-19","m":5,"s":"3.1","tr":"Consistently off-target is bias. Scattered is variance. Mixing up these two pictures is common."},{"t":"mc","q":"For ensembles to beat single models, which condition matters most?","o":["All models make identical errors","Base models are better than random and make different errors","Base models are linear","There are fewer than 5 models"],"a":1,"x":"Wisdom of crowds: reasonably good, diverse models whose errors cancel out when combined.","id":"m5-20","m":5,"s":"1.2","tr":"Identical models make identical mistakes, so averaging them gains nothing. Diversity is the point."},{"t":"mc","q":"How do you typically choose the number of trees in a Random Forest?","o":["Always use 10","Plot OOB error against the number of trees and stop when it plateaus","Match the number of features","Use as few as possible to avoid overfitting"],"a":1,"x":"Adding trees doesn't overfit; it just stabilizes. Stop when OOB error stops improving to save compute.","id":"m5-21","m":5,"s":"6.5","tr":"Adding trees to a Random Forest doesn't overfit; it just stops helping. Boosting is the one where more rounds can overfit."},{"t":"tf","q":"Random Forests need feature scaling and can't handle mixed numeric and categorical features.","a":false,"x":"They're tree-based, so no scaling is needed, and mixed feature types are handled naturally.","id":"m5-22","m":5,"s":"8.4","tr":"Tree-based methods are scale-invariant and handle mixed feature types. Scaling is a KNN, K-Means, and PCA concern."},{"m":5,"t":"code","s":"10","q":"Get the free out-of-bag accuracy from a Random Forest.","c":"rf = RandomForestClassifier(n_estimators=300,\n        ____, random_state=42).fit(X_train, y_train)\nprint(rf.oob_score_)","o":["oob_score=True","bootstrap=False","max_features=None","warm_start=True"],"a":0,"x":"oob_score=True scores each row using only the trees that didn't see it.","tr":"bootstrap=False would leave no out-of-bag rows. max_features=None turns the forest into plain bagging.","id":"c5-1"},{"m":5,"t":"code","s":"11","q":"Which call computes permutation importance on held-out data?","c":"from sklearn.inspection import permutation_importance\nr = ____","o":["permutation_importance(rf, X_test, y_test, random_state=42)","rf.feature_importances_","permutation_importance(rf, X_train)","rf.oob_score_"],"a":0,"x":"It shuffles each column of the held-out data and measures the score drop.","tr":"feature_importances_ is MDI, which is impurity-based and biased toward high-cardinality features. Permutation importance also needs y.","id":"c5-2"},{"t":"mc","q":"What is the core difference between bagging and boosting?","o":["Bagging trains models sequentially; boosting trains them in parallel","Bagging trains independent models in parallel; boosting trains models sequentially, each fixing earlier mistakes","Boosting uses bootstrap samples; bagging doesn't","They are the same"],"a":1,"x":"Bagging is parallel and averages away variance. Boosting is sequential: each learner focuses on what the ensemble so far gets wrong.","id":"m6-1","m":6,"s":"6.1","tr":"Don't swap the two: bagging is parallel (independent models), boosting is sequential (each model corrects the last)."},{"t":"mc","q":"What is a \"weak learner\"?","o":["A model with 0% accuracy","A model only slightly better than random guessing (e.g. 51–60% on a binary task)","A model with high variance","Any deep tree"],"a":1,"x":"Examples: a decision stump (one split) or a single rule like \"if age > 30, predict survived.\"","id":"m6-2","m":6,"s":"2.1","tr":"Weak isn't useless. It just needs to beat chance. Boosting turns many of them into a strong learner."},{"t":"mc",
